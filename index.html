/* Layout: home screen (open by Drive link or file, recent charts); chart screen with a sticky header bar and the song map, one column on phones, two columns of outlined section boxes on wide screens; editor; A4 PDF page */
/* Шрифты свои (fonts/): латиница — Lato, кириллица — Carlito, ♭♮♯ — Noto Sans Symbols. Облегчены до нужных знаков и по лицензии OFL
   переименованы (tools/fonts.py). Те же файлы встраиваются в PDF, поэтому PDF совпадает со страницей. */
@font-face { font-family: "Faworship Latin"; src: url(fonts/latin-400.ttf) format("truetype"); font-weight: 400; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Faworship Latin"; src: url(fonts/latin-700.ttf) format("truetype"); font-weight: 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Faworship Latin"; src: url(fonts/latin-900.ttf) format("truetype"); font-weight: 900; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Faworship Cyrillic"; src: url(fonts/cyrillic-400.ttf) format("truetype"); font-weight: 400; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Faworship Cyrillic"; src: url(fonts/cyrillic-700.ttf) format("truetype"); font-weight: 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Faworship Symbols"; src: url(fonts/symbols-400.ttf) format("truetype"); font-weight: 400; font-display: swap; unicode-range: U+266D-266F; }
@font-face { font-family: "Faworship Symbols"; src: url(fonts/symbols-700.ttf) format("truetype"); font-weight: 700; font-display: swap; unicode-range: U+266D-266F; }
:root {
  --bg: #FFFFFF; --bg2: #F2F2F0; --card: #FFFFFF; --ink: #121214; --ink2: #2A2A2E; --muted: #6B6C71; --line: #E3E3E0; --box: #C9CACF;
  --chip: #E8E8E5; --accent: #FFB43C; --accent-ink: #1F2023; --accent-text: #8F5300; --slash: #E2513A; --bar: rgba(255, 255, 255, 0.94); --scrim: rgba(0, 0, 0, 0.32);
  --s-intro: #2B6E73; --s-verse: #4E4794; --s-pre: #977A24; --s-chorus: #964D26; --s-post: #2F634A; --s-turn: #527A29; --s-bridge: #83434E; --s-inter: #813A35; --s-plain: #6B6B73;
  --ok: #23845A; --warn: #B06A00;
  --font: "Faworship Latin", "Faworship Cyrillic", "Faworship Symbols", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs: 1;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1F2023; --bg2: #2A2B30; --card: #2A2B30; --ink: #F3F3F5; --ink2: #E2E2E6; --muted: #A9A9AF; --line: #3A3B41; --box: #4A4B51;
  --chip: #34353B; --accent: #FFB43C; --accent-ink: #1F2023; --accent-text: #FFB43C; --slash: #FF6B52; --bar: rgba(31, 32, 35, 0.94); --scrim: rgba(0, 0, 0, 0.55);
  --s-intro: #52A6AC; --s-verse: #8F87E2; --s-pre: #D3AF4C; --s-chorus: #DB7A42; --s-post: #52A27B; --s-turn: #8BB85A; --s-bridge: #C76F7D; --s-inter: #CA625A; --s-plain: #9A9AA1;
  --ok: #4CC38A; --warn: #F0B640; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1F2023; --bg2: #2A2B30; --card: #2A2B30; --ink: #F3F3F5; --ink2: #E2E2E6; --muted: #A9A9AF; --line: #3A3B41; --box: #4A4B51;
  --chip: #34353B; --accent: #FFB43C; --accent-ink: #1F2023; --accent-text: #FFB43C; --slash: #FF6B52; --bar: rgba(31, 32, 35, 0.94); --scrim: rgba(0, 0, 0, 0.55);
  --s-intro: #52A6AC; --s-verse: #8F87E2; --s-pre: #D3AF4C; --s-chorus: #DB7A42; --s-post: #52A27B; --s-turn: #8BB85A; --s-bridge: #C76F7D; --s-inter: #CA625A; --s-plain: #9A9AA1;
  --ok: #4CC38A; --warn: #F0B640; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; border-radius: 6px; }
.wrap { width: 100%; max-width: 46rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
svg { display: block; flex: none; }
.muted { color: var(--muted); }

/* ---------- значки секций ---------- */
.t-intro { --sc: var(--s-intro); } .t-verse { --sc: var(--s-verse); } .t-pre { --sc: var(--s-pre); } .t-chorus { --sc: var(--s-chorus); }
.t-post { --sc: var(--s-post); } .t-turn { --sc: var(--s-turn); } .t-bridge { --sc: var(--s-bridge); } .t-inter { --sc: var(--s-inter); } .t-plain { --sc: var(--s-plain); }
.bdg { position: relative; flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1.75px solid var(--sc); color: var(--sc); background: transparent; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; letter-spacing: -0.01em; padding: 0; }
.bdg sup { position: absolute; top: -5px; right: -4px; font-size: 11px; line-height: 1; font-weight: 900; color: var(--ink); background: var(--bar); padding: 1px 1px 2px 2px; border-radius: 4px; }
.bdg.sm { width: 26px; height: 26px; font-size: 11.5px; border-width: 1.5px; }
.bdg.sm sup { font-size: 9.5px; top: -4px; right: -5px; background: var(--bg); }

/* ---------- аккорды ---------- */
.ch { font-weight: 700; color: var(--ink); white-space: nowrap; }
.ch sup { font-size: 0.68em; line-height: 0; position: relative; top: -0.05em; vertical-align: super; margin-left: 0.02em; }
.ch .pre { margin-right: 0.04em; margin-left: 0; }

/* ---------- экран песни ---------- */
.cbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px); border-bottom: 1px solid var(--line); }
.cbar-row { display: flex; align-items: center; gap: 6px; padding-block: 8px; min-width: 0; }
.ib { width: 36px; height: 36px; border: 0; background: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--ink); margin-left: -8px; }
.ctitle { border: 0; background: none; display: flex; align-items: center; gap: 6px; padding: 4px 2px; min-width: 0; flex: 1; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; text-align: left; }
.ctitle span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctitle svg { color: var(--muted); }
.sq { min-width: 36px; height: 34px; padding: 0 10px; border-radius: 8px; border: 0; background: var(--chip); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
.sq .ch { font-weight: 700; }
.sq.keyb { border: 1.5px solid var(--accent-text); color: var(--accent-text); background: var(--bg2); font-size: 17px; }
.sq.keyb .ch { color: inherit; }
.sq.keyb:disabled { border-color: var(--line); color: var(--muted); }
.sq.big { width: 50px; height: 50px; border-radius: 12px; }
.sq small { font-size: 11px; color: var(--muted); margin-left: 4px; }
.map { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-top: 4px; padding-bottom: 10px; }
.map::-webkit-scrollbar { display: none; }
.map .bdg { background: var(--bar); }


.info { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 14px; padding-top: 14px; font-size: 13px; color: var(--muted); }
.info b { font-weight: 700; color: var(--muted); }
.info .v { color: var(--ink2); margin-right: 10px; }
.flag { margin-top: 6px; font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); }

.chart { padding-block: 10px 6px; font-size: calc(17px * var(--fs)); }
.sec { padding-top: 22px; }
.sh { display: flex; align-items: center; gap: 10px; }
.sh .sl { font-size: calc(14px * var(--fs)); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
.sh::after { content: ""; flex: 1; height: 1px; background: var(--sc); opacity: 0.55; }
.md { text-align: right; color: var(--muted); font-size: calc(14px * var(--fs)); line-height: 1.35; margin-top: 6px; }
.body { padding-top: 4px; }
.ln { margin-top: 0.62em; line-height: 1.25; word-spacing: 0.14em; color: var(--ink2); }
.w { white-space: nowrap; }
.a { display: inline-block; position: relative; }
.a .c { display: block; line-height: 1.25; word-spacing: 0; }
.a.tight .c { padding-right: 0.5em; }
.a.hy::after { content: "-"; position: absolute; left: var(--hx); bottom: 0; transform: translateX(-50%); color: var(--muted); }
.co { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25em 0.9em; color: var(--ink); }
.co .sl { color: var(--slash); font-weight: 700; font-style: normal; letter-spacing: 0.06em; }
.co .bl { color: var(--box); font-weight: 400; }
.co .gb { display: inline-flex; gap: 0.35em; align-items: baseline; }
.blank { height: 0.6em; }
.cmt { margin-top: 0.6em; color: var(--muted); font-style: italic; }

@media (min-width: 820px) {
  .chartwrap { max-width: 68rem; }
  .chart { columns: 2; column-gap: 34px; padding-top: 6px; }
  /* рамка рисуется внутри блока секции: с отрицательным отступом заголовок уезжал в соседний столбец */
  .sec { position: relative; break-inside: avoid; -webkit-column-break-inside: avoid; page-break-inside: avoid; padding: 2px 16px 16px; margin-top: 16px; display: flow-root; }
  .sec::before { content: ""; position: absolute; inset: 15px 0 0; border: 1px solid var(--box); border-radius: 12px; pointer-events: none; }
  .sh { position: relative; z-index: 1; width: fit-content; margin-left: -6px; }
  .sh .bdg, .sh .sl { background: var(--bg); }
  .sh .sl { padding-right: 8px; }
  .sh::after { display: none; }
  .sh .bdg { box-shadow: 0 0 0 5px var(--bg); }
  .chart > .sec:first-child { margin-top: 0; }
}

/* переход по карте песни: секция, куда прыгнули, вспыхивает цветом своего значка — на телефоне фоном, на широком экране рамкой */
@keyframes hl-fill { from { background: color-mix(in srgb, var(--sc) 20%, transparent); } }
@keyframes hl-box { from { border-color: var(--sc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sc) 30%, transparent); } }
@keyframes hl-bdg { 30% { transform: scale(1.25); background: var(--sc); color: var(--bg); } }
.sec.hl .sh .bdg { animation: hl-bdg 0.9s ease-out; }
/* фон — отдельным слоем под текстом: от заголовка (у секции сверху пустой отступ 22 px), с запасом 8 px со всех сторон */
@media (max-width: 819px) {
  .sec.hl { position: relative; isolation: isolate; }
  .sec.hl::after { content: ""; position: absolute; inset: 14px -8px -8px; z-index: -1; border-radius: 12px; animation: hl-fill 1.8s ease-out; }
}
@media (min-width: 820px) { .sec.hl::before { animation: hl-box 1.8s ease-out; } }
@media (prefers-reduced-motion: reduce) { .sec.hl .sh .bdg { animation: none; } }

.cfoot { padding-block: 26px 10px; display: grid; gap: 3px; justify-items: end; text-align: right; font-size: 12px; color: var(--muted); }
details.check { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; font-size: 15px; }
details.check summary { cursor: pointer; font-weight: 700; }
details.check ul { padding-left: 1.2rem; margin: 10px 0; display: grid; gap: 4px; }

/* ---------- листы настроек ---------- */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-panel { width: min(100%, 30rem); max-height: 100%; overflow-y: auto; background: var(--bg); border-radius: 16px; padding: 0 18px 20px; box-shadow: 0 16px 48px rgb(0 0 0 / 0.28); }
.sheet-h { position: sticky; top: 0; background: var(--bg); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-block: 16px 10px; z-index: 1; }
.sheet-h b { font-size: 17px; font-weight: 700; text-align: center; }
.done { justify-self: end; border: 0; background: none; color: var(--accent-text); font-weight: 700; font-size: 17px; padding: 4px 0; }
.grp { margin-top: 18px; }
.grp > label, .grp > .lab { display: block; font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
.selw { position: relative; display: flex; align-items: center; }
.selw select { appearance: none; -webkit-appearance: none; width: 100%; padding: 11px 40px 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); font-size: 16px; }
.selw svg { position: absolute; right: 14px; pointer-events: none; color: var(--muted); }
.tgl { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); font-size: 16px; }
.tgl small { display: block; font-size: 12.5px; color: var(--muted); }
.sw { flex: none; width: 51px; height: 31px; border-radius: 999px; border: 0; background: var(--line); position: relative; transition: background 0.15s; padding: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgb(0 0 0 / 0.25); transition: transform 0.15s; }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.stepper { display: flex; align-items: center; gap: 14px; }
.stepper button { width: 44px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); font-size: 17px; }
.stepper b { min-width: 3.5rem; text-align: center; font-variant-numeric: tabular-nums; }
.keys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.keys button { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); font-size: 17px; position: relative; }
.keys button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.keys button[aria-pressed="true"] .ch { color: var(--accent-ink); }
.keys .ch { font-weight: 700; }
.keys .mark { position: absolute; bottom: 4px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; opacity: 0.55; }
.hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
.linkb { border: 0; background: none; padding: 0; color: var(--accent-text); font-weight: 700; }
.linkb.dim { color: var(--muted); font-weight: 400; font-size: 14px; }
.segc { display: flex; background: var(--chip); border-radius: 9px; padding: 2px; gap: 2px; }
.segc button { flex: 1; border: 0; background: none; padding: 7px 6px; border-radius: 7px; font-size: 14px; font-weight: 700; color: var(--ink2); }
.segc button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgb(0 0 0 / 0.15); color: var(--ink); }

/* ---------- списки ---------- */
.screen { padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }
.lhead { padding-block: calc(22px + env(safe-area-inset-top, 0px)) 6px; display: grid; gap: 12px; }
.lhead h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
.lhead .ib { margin: 0 -8px 0 0; color: var(--muted); }
.search { display: flex; align-items: center; gap: 8px; background: var(--chip); border-radius: 10px; padding: 0 12px; color: var(--muted); }
.search input { flex: 1; border: 0; background: none; padding: 10px 0; font-size: 16px; color: var(--ink); outline: none; min-width: 0; }
.rows { list-style: none; margin: 0; padding: 0; }
.row a { display: grid; grid-template-columns: minmax(0, 1fr) auto 2.6em; gap: 0 10px; align-items: center; padding-block: 11px; border-bottom: 1px solid var(--line); }
.row.n a { grid-template-columns: 1.4em minmax(0, 1fr) auto 2.6em; }
.row:last-child a { border-bottom-color: transparent; }
.row .num { color: var(--muted); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.row .txt { min-width: 0; display: grid; gap: 1px; }
.row .t { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kc { min-width: 2.3em; padding: 4px 8px; border-radius: 6px; background: var(--chip); text-align: center; font-size: 16px; font-weight: 700; line-height: 1.25; box-sizing: border-box; }
.kc:empty { background: none; }
.kc .ch { font-weight: 700; }
.bpm { text-align: right; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { padding: 14px 0; color: var(--muted); }

.about { margin-top: 28px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
/* ---------- редактор ---------- */
.lhead-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 9px; padding: 8px 14px; font-weight: 700; font-size: 15px; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--chip); color: var(--ink); }
.btn svg { width: 16px; height: 16px; }
.btn.big { flex: 1; justify-content: center; height: 50px; border-radius: 12px; font-size: 16px; }
.edwrap { max-width: 76rem; }
.ed { display: grid; gap: 20px; padding-block: 12px 48px; }
.ed-tabs { margin-top: 12px; }
@media (max-width: 899px) { .ed[data-tab="edit"] .ed-prev, .ed[data-tab="prev"] .ed-text { display: none; } }
@media (min-width: 900px) {
  .ed { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .ed-tabs { display: none; }
  .ed-prev { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); max-height: calc(100vh - 80px); overflow-y: auto; border-left: 1px solid var(--line); padding-left: 20px; }
}
.ed-prev .chart { columns: 1; }
.meta-f { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.meta-f label { display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
.meta-f input, .meta-f select { font-size: 16px; font-weight: 400; text-transform: none; letter-spacing: 0; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); min-width: 0; }
.meta-f .wide { grid-column: 1 / -1; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.tool { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg2); border-radius: 9px; padding: 6px 10px; font-size: 14px; font-weight: 700; color: var(--ink); }

const CHORD_RE = /(^|[^A-Za-z#])([A-H])(#|b)?((?:maj|min|dim|aug|sus|add|m|M)?\d*(?:sus\d*|add\d*)?)(?:\/([A-H])(#|b)?)?(?![a-z])/g;
const mod = (n) => ((n % 12) + 12) % 12;
const pcOf = (l, acc) => mod(PC[l] + (acc === "#" ? 1 : acc === "b" ? -1 : 0));
const ACC = { "#": "♯", b: "♭" };

function parseKey(s) {
  const m = /^\s*([A-H])(#|b)?(m(?!aj))?/.exec(s || "");
  return m ? { pc: pcOf(m[1], m[2]), minor: !!m[3] } : null;
}
const flatKey = (k) => [5, 10, 3, 8, 1].includes(mod(k.minor ? k.pc + 3 : k.pc));
const noteName = (pc, flats) => (S.notation === "int" ? (flats ? INT_F : INT_S) : RU)[mod(pc)];
function noteHTML(name) { return esc(name[0]) + (name[1] ? `<sup>${ACC[name[1]]}</sup>` : ""); }
function keyHTML(k) { return `<span class="ch">${noteHTML(noteName(k.pc, flatKey(k)))}${k.minor ? "m" : ""}</span>`; }

// ctx: { shift — на сколько сдвинуть, key — тональность, в которой показываем (после capo) }
function chordHTML(m, ctx) {
  const [, , l, acc, q0, bl, bacc] = m;
  const root = mod(pcOf(l, acc) + ctx.shift);
  const bass = bl ? mod(pcOf(bl, bacc) + ctx.shift) : null;
  const tonic = mod(ctx.key.minor ? ctx.key.pc + 3 : ctx.key.pc);
  let q = q0, head;
  const minor = /^m(?!aj)/.test(q);
  const deg = (pc, table) => { const d = table[mod(pc - tonic)]; return /^[♭♯]/.test(d) ? `<sup class="pre">${d[0]}</sup>${d.slice(1)}` : d; };
  if (S.ctype === "numbers") head = deg(root, DEG);
  else if (S.ctype === "roman") { head = deg(root, ROM); if (minor) { head = head.toLowerCase(); q = q.replace(/^m/, ""); } q = q.replace(/^dim/, "°"); }
  else head = noteHTML(noteName(root, flatKey(ctx.key)));
  const qm = /^m(?!aj)/.test(q) ? "m" : "";
  const rest = q.slice(qm.length);
  const bassH = bass === null ? "" : "/" + (S.ctype === "numbers" ? deg(bass, DEG) : S.ctype === "roman" ? deg(bass, ROM) : noteHTML(noteName(bass, flatKey(ctx.key))));
  return `<span class="ch">${head}${qm}${rest ? `<sup>${esc(rest)}</sup>` : ""}${bassH}</span>`;
}
function rich(str, ctx) {
  let out = "", last = 0, m;
  CHORD_RE.lastIndex = 0;
  while ((m = CHORD_RE.exec(str))) {
    out += esc(str.slice(last, m.index) + m[1]) + chordHTML(m, ctx);
    last = CHORD_RE.lastIndex;
  }
  return out + esc(str.slice(last));
}
const plainLen = (str, ctx) => { const d = document.createElement("div"); d.innerHTML = rich(str, ctx); return d.textContent.length; };

// ---------- ChordPro ----------
const TYPES = [[/count/, "intro", "Ci"], [/pre/, "pre", "Pc"], [/post/, "post", "Po"], [/intro|вступ/, "intro", "I"], [/verse|куплет/, "verse", "V"],
  [/chorus|припев/, "chorus", "C"], [/bridge|бридж/, "bridge", "B"], [/interlude/, "inter", "It"], [/instr|проигр/, "inter", "In"], [/turn/, "turn", "Ta"],
  [/tag/, "chorus", "Tg"], [/break/, "post", "Bd"], [/build/, "bridge", "Bu"], [/vamp/, "inter", "Vp"], [/refrain/, "post", "Rf"], [/solo|соло/, "inter", "So"],
  [/\brap\b/, "bridge", "Rp"], [/ad.?lib|спонт/, "turn", "Ad"], [/ending|оконч/, "intro", "E"], [/outro/, "intro", "O"], [/coda|кода/, "intro", "Cd"]];
function secType(label, env) {
  const l = label.toLowerCase();
  for (const [re, t, a] of TYPES) if (re.test(l)) return { type: t, abbr: a + ((/\d+/.exec(label) || [""])[0]) };
  const t = { grid: "inter", chorus: "chorus", bridge: "bridge" }[env] || "verse";
  return { type: t, abbr: label.slice(0, 2) };
}
function parseLine(line) {
  const parts = line.split(/\[([^\]]*)\]/);
  const segs = [{ chord: null, text: parts[0] }];
  for (let i = 1; i < parts.length; i += 2) segs.push({ chord: parts[i], text: parts[i + 1] || "" });
  if (segs.every((s) => /^[\s|]*$/.test(s.text)) && segs.some((s) => s.chord)) {
    const items = [];
    segs.forEach((s) => { if (s.chord) items.push({ chord: s.chord }); if (s.text.includes("|")) items.push({ bar: true }); });
    return { kind: "chords", items };
  }
  return { kind: "lyric", segs: segs.filter((s) => s.chord || s.text) };
}
const choCache = {};
function parseCho(text, fresh) {
  if (!fresh && choCache[text]) return choCache[text];
  const song = { meta: {}, sections: [], map: [] };
  let cur = null;
  for (const raw of text.split("\n")) {
    const line = raw.replace(/\s+$/, "");
    const d = /^\{(\w+)(?::\s*(.*))?\}$/.exec(line);
    if (d) {
      const [, nm, arg = ""] = d;
      if (/^(start_of_|so[cvbgt]$)/.test(nm)) {
        const env = nm.replace("start_of_", "");
        const label = (/label="([^"]*)"/.exec(arg) || [])[1] || arg || env;
        cur = { label, env, ...secType(label, env), lines: [], md: [] };
        song.sections.push(cur);
      } else if (/^(end_of_|eo[cvbgt]$)/.test(nm)) cur = null;
      else if (nm === "meta") { const m = /^(\S+)\s+(.*)$/.exec(arg); if (m) song.meta[m[1]] = m[2]; }
      else if ((nm === "comment" || nm === "c") && cur) {
        if (/^MD:/i.test(arg)) cur.md.push(arg.replace(/^MD:\s*/i, ""));
        else cur.lines.push({ kind: "comment", text: arg });
      } else song.meta[nm] = arg;
      continue;
    }
    if (!cur || /^\s*#/.test(line)) continue;
    if (cur.env === "grid") {
      if (line.trim()) cur.lines.push({ kind: "grid", bars: line.split("|").map((b) => b.trim()).filter(Boolean).map((b) => b.split(/\s+/)) });
      continue;
    }
    cur.lines.push(line.trim() ? parseLine(line) : { kind: "blank" });
  }
  const entries = []; let depth = 0, buf = "";
  for (const ch of (song.meta.map || "") + ",") {
    if (ch === "(") depth++; if (ch === ")") depth--;
    if (ch === "," && !depth) { if (buf.trim()) entries.push(buf.trim()); buf = ""; } else buf += ch;
  }
  song.map = entries.length ? entries.map((e) => {
    const m = /^(.*?)(?:\s*[x×](\d+))?\s*(?:\((.*)\))?$/.exec(e);
    const nm = m[1].trim().toLowerCase();
    const sec = song.sections.find((x) => x.label.toLowerCase() === nm) || song.sections.find((x) => x.label.toLowerCase().startsWith(nm));
    return { sec, times: +(m[2] || 1), note: (m[3] || "").replace(/^MD:\s*/i, "") };
  }).filter((o) => o.sec) : song.sections.map((sec) => ({ sec, times: 1, note: "" }));
  return fresh ? song : (choCache[text] = song);
}

// ---------- отрисовка чарта ----------
function lyricHTML(line, ctx) {
  if (S.view === "ly") return `<div class="ln">${esc(line.segs.map((s) => s.text).join(""))}</div>`;
  if (S.view === "co") {
    const cs = line.segs.filter((s) => s.chord);
    return cs.length ? `<div class="ln co">${cs.map((s) => `<span>${rich(s.chord, ctx)}</span>`).join("")}</div>` : "";
  }
  const words = []; let cur = [];
  for (const seg of line.segs) {
    let pending = seg.chord;
    for (const tok of seg.text.split(/(\s+)/)) {
      if (!tok && pending == null) continue;
      if (/^\s+$/.test(tok)) {
        if (pending != null) { cur.push({ chord: pending, text: "" }); pending = null; }
        if (cur.length) { words.push(cur); cur = []; }
        words.push(" ");
      } else { cur.push({ chord: pending, text: tok }); pending = null; }
    }
    if (pending != null) cur.push({ chord: pending, text: "" });
  }
  if (cur.length) words.push(cur);
  // отступ справа у аккорда — только если следующий аккорд ближе, чем ширина этого
  let pos = 0; const anchors = [];
  for (const w of words) for (const p of w === " " ? [{ text: " " }] : w) { if (p.chord != null) anchors.push([p, pos]); pos += p.text.length; }
  anchors.forEach(([p, at], i) => { p.tight = i + 1 < anchors.length && anchors[i + 1][1] - at <= plainLen(p.chord, ctx) + 1; });
  return `<div class="ln">${words.map((w) => w === " " ? " " : `<span class="w">${w.map((p, i) => p.chord == null ? esc(p.text)
    : `<span class="a${p.tight ? " tight" : ""}${i < w.length - 1 ? " mid" : ""}"><span class="c">${rich(p.chord, ctx)}</span><span class="x">${esc(p.text) || "&nbsp;"}</span></span>`).join("")}</span>`).join("")}</div>`;
}
function gridHTML(l, ctx) {
  return `<div class="ln co">${l.bars.map((b) => {
    const chords = b.filter((t) => t !== "/" && t !== ".").map((t) => rich(t, ctx)).join(" ");
    const sl = b.filter((t) => t === "/" || t === ".").length;
    return `<span class="gb">${chords}${sl ? `<i class="sl">${"/".repeat(sl)}</i>` : ""}</span>`;
  }).join('<span class="bl">|</span>')}</div>`;
}
function bodyHTML(sec, ctx) {
  if (S.view === "ly" && sec.env === "grid") return "";
  const out = sec.lines.map((l) => {
    if (l.kind === "grid") return gridHTML(l, ctx);
    if (l.kind === "blank") return S.view === "co" ? "" : `<div class="blank"></div>`;
    if (l.kind === "comment") return `<div class="cmt">${esc(l.text)}</div>`;
    if (l.kind === "chords") return S.view === "ly" ? "" : `<div class="ln co">${l.items.map((i) => i.bar ? '<span class="bl">|</span>' : `<span>${rich(i.chord, ctx)}</span>`).join("")}</div>`;
    return lyricHTML(l, ctx);
  }).join("");
  return out ? `<div class="body">${out}</div>` : "";
}
function secHTML(sec, ctx, { id, times = 1, notes = [], headerOnly = false }) {
  const md = S.showMD ? [...sec.md, ...notes].filter(Boolean) : [];
  return `<section class="sec t-${sec.type}" id="${id}">
    <div class="sh"><span class="bdg sm">${esc(sec.abbr)}${times > 1 ? `<sup>${times}</sup>` : ""}</span><span class="sl">${esc(sec.label)}</span></div>
    ${md.length ? `<div class="md">${md.map(esc).join("<br>")}</div>` : ""}
    ${headerOnly ? "" : bodyHTML(sec, ctx)}</section>`;
}
function chartHTML(song, ctx) {
  if (S.view === "map") return song.map.map((o, k) => secHTML(o.sec, ctx, { id: `o-${k}`, times: o.times, notes: [o.note], headerOnly: true })).join("");
  if (S.sections === "condensed") {
    const seen = new Set();
    return song.map.map((o, k) => { const h = seen.has(o.sec); seen.add(o.sec); return secHTML(o.sec, ctx, { id: `o-${k}`, times: o.times, notes: [o.note], headerOnly: h }); }).join("");
  }
  return song.map.map((o, k) => Array.from({ length: o.times }, (_, j) =>
    secHTML(o.sec, ctx, { id: j ? `o-${k}-${j}` : `o-${k}`, notes: j ? [] : [o.note] })).join("")).join("");
}

function srcInfo(r) {
  let m;
  if (r === "demo") return { key: "demo", from: "demo", route: r };
  if (r === "new") return { key: "new", from: "new", route: r };
  if ((m = /^file\/(\w+)$/.exec(r))) return { key: "f:" + m[1], from: "file", route: r };
  if ((m = /^t\/([uz][\w-]+)$/.exec(r))) return { key: "t:" + m[1], from: "link", route: r, data: m[1] };
  if ((m = /^url\/([\w-]+)$/.exec(r))) { const url = b64s.dec(m[1]); return /^https?:\/\//.test(url) ? { key: "u:" + m[1], from: "url", route: r, url } : null; }
  if ((m = /^(?:[a-z0-9-]*\.)?([\w-]{20,})$/.exec(r))) return { key: "d:" + m[1], from: "drive", route: r, id: m[1] };
  return null;
}

// ссылка, которую вставили: на файл или папку Google Диска, на песню, сет или библиотеку этого сайта, на файл в GitHub, Dropbox или где угодно
const rawUrl = (u) => {
  const m = /^https?:\/\/github\.com\/([^/]+\/[^/]+)\/(?:blob|raw)\/(.+)$/.exec(u);
  if (m) return `https://raw.githubusercontent.com/${m[1]}/${m[2]}`;
  if (/^https?:\/\/(www\.)?dropbox\.com\//.test(u)) { const x = new URL(u); x.hostname = "dl.dropboxusercontent.com"; x.searchParams.delete("dl"); return x.href; }
  return u;
};
function parseLink(s) {
  s = (s || "").trim();
  let m;
  const own = s.startsWith("#") || [CONFIG.site, location.origin + location.pathname].some((b) => b && s.startsWith(b + "#"));
  if (own && (m = /#(set\/[^?\s/]*)(?:\/\d+)?(?:\?n=([^&\s]*))?/.exec(s))) { let n = ""; try { n = decodeURIComponent(m[2] || ""); } catch {} return { set: m[1].slice(4), name: n }; }
  if (own && (m = /#lib\/(?:[a-z0-9-]*\.)?([\w-]{20,})/.exec(s))) return { lib: m[1] };
  if (own) {
    if (!(m = /#([^?\s]+)(?:\?key=([^&\s]*))?/.exec(s)) || !srcInfo(m[1])) return { err: "Это ссылка на сайт, но не на песню, сет или библиотеку" };
    let k = ""; try { k = decodeURIComponent(m[2] || ""); } catch {}
    return { route: m[1], key: k };
  }
  if (/(drive|docs)\.google\.com/.test(s)) {
    if (/\/folders\//.test(s)) return (m = /\/folders\/([\w-]{20,})/.exec(s)) ? { lib: m[1] } : { err: "Не похоже на ссылку на папку Google Диска" };
    m = /\/d\/([\w-]{20,})/.exec(s) || /[?&]id=([\w-]{20,})/.exec(s);
    return m ? { route: m[1] } : { err: "Не похоже на ссылку на файл Google Диска" };
  }
  if (/^https?:\/\/\S+$/i.test(s)) return { route: "url/" + b64s.enc(rawUrl(s)) };
  if (/^[\w-]{20,}$/.test(s)) return { route: s };
  return { err: "Не похоже на ссылку на файл" };
}

// Google Диск: файл с доступом «Все, у кого есть ссылка» читается по ключу API без входа в аккаунт
async function driveText(id) {
  if (!CONFIG.driveKey) throw { msg: "На сайте ещё не задан ключ Google Drive API, поэтому файлы с Диска пока не открываются. Скачай .cho и открой его файлом." };
  let r;
  try { r = await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?alt=media&supportsAllDrives=true&key=${CONFIG.driveKey}`); }
  catch { throw { msg: "Нет связи с Google Диском." }; }
  if (r.ok) return await r.text();
  let detail = ""; try { detail = (await r.json()).error.message || ""; } catch {}
  if (r.status === 404) throw { msg: "Файл не найден. Либо у него закрыт доступ по ссылке, либо его удалили или загрузили заново — тогда у файла новый адрес и нужна новая ссылка.", detail };
  if (/export/i.test(detail)) {
    // так Диск отвечает и на Google Документ, и на папку; по ссылке drive.google.com/open?id=… (её копирует Google Drive на компьютере) их не различить
    let mime = ""; try { mime = (await (await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?fields=mimeType&supportsAllDrives=true&key=${CONFIG.driveKey}`)).json()).mimeType; } catch {}
    if (mime === FOLDER) throw { msg: "Это папка, а не файл .cho — она открывается как библиотека.", folder: id };
    throw { msg: "Это Google Документ, а не файл .cho.", detail };
  }
  if (r.status === 403) throw { msg: "Google Диск отказал в доступе. Проверь доступ к файлу: «Все, у кого есть ссылка».", detail };
  throw { msg: `Google Диск ответил ошибкой ${r.status}.`, detail };
}
// файл по любой ссылке: сайт, где он лежит, должен разрешать читать файлы с других сайтов (CORS) — так у GitHub и Dropbox
async function urlText(url) {
  let r;
  try { r = await fetch(url); }
  catch { throw { msg: "Файл по ссылке не открылся: нет связи, или сайт, где он лежит, не даёт читать файлы с других сайтов. Подходят Google Диск, GitHub и Dropbox.", detail: url }; }
  if (!r.ok) throw { msg: r.status === 404 ? "Файл по ссылке не найден." : `Сайт с файлом ответил ошибкой ${r.status}.`, detail: url };
  return await r.text();
}

// чарт прямо в ссылке: deflate + base64url (z…), без сжатия — u…
const b64u = {
  enc: (bytes) => { let s = ""; for (const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); },
  dec: (str) => Uint8Array.from(atob(str.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0)),
};
async function pack(text) {
  const raw = new TextEncoder().encode(text);

// пачка запросов к Drive API одним запросом; ответ — multipart, части помечены номером запроса
async function driveBatch(paths) {

}

  const pdf = await PDFDocument.create(); pdf.registerFontkit(window.fontkit);
  const fonts = {};
  await Promise.all([...new Set(sheets.flat().filter((op) => op.t === "text").map((op) => op.font))]
    .map(async (n) => { fonts[n] = await pdf.embedFont(await loadFont(n), { subset: true }); }));
  for (const ops of sheets) {
    const page = pdf.addPage(A4), H = A4[1];
    for (const op of ops) {
      if (op.t === "text") {
        const f = fonts[op.font], x = op.mid ? op.x - f.widthOfTextAtSize(op.s, op.size) / 2 : op.x;
        page.drawText(op.s, { x: x * PT, y: H - op.y * PT, size: op.size * PT, font: f, color: rgb(...op.c), ...(op.it && { xSkew: degrees(12) }) });
      } else {
        const k = op.t === "line" ? op.bw / 2 : 0; // линия рисуется по середине рамки
        page.drawSvgPath(roundRect(op.x + k, op.y + k, op.w - 2 * k, op.h - 2 * k, Math.max(0, op.r - k)),
          { x: 0, y: H, scale: PT, ...(op.t === "line" ? { borderColor: rgb(...op.c), borderWidth: op.bw } : { color: rgb(...op.c) }) });
      }
    }
  }
  pdf.setTitle(pdfName); pdf.setCreator("faworship.github.io"); pdf.setProducer("ChartSet"); pdf.setLanguage("ru");
  return pdf.save();
}
// На телефоне — меню «Поделиться» (на iPhone скачанный PDF открывается вкладкой, и неясно, как его сохранить), на компьютере — скачивание.
// Меню открывается только сразу после нажатия: программа для PDF и шрифты грузятся заранее, а если сборка всё же затянулась
// и браузер меню не дал — готовый файл ждёт второго нажатия («Сохранить PDF»).
const phoneShare = () => matchMedia("(pointer: coarse)").matches && !!navigator.canShare;
const preloadPdf = () => { if ($("#pages")) [...PDF_JS.map(loadJs), ...Object.entries(FACES).flatMap(([f, ws]) => ws.map((w) => loadFont(`${f}-${w}`)))].forEach((x) => x.catch(() => {})); };
let pdfReady = null; // { at: адрес с настройками, file }
async function downloadPdf(btn) {
  if (btn.disabled) return;
  const at = location.hash;
  if (pdfReady && pdfReady.at === at && phoneShare()) return sharePdf(pdfReady.file, btn);
  btn.disabled = true; btn.textContent = "Готовлю…";
  try {
    const file = new File([await pdfFile()], pdfName + ".pdf", { type: "application/pdf" });
    if (phoneShare() && navigator.canShare({ files: [file] })) { pdfReady = { at, file }; await sharePdf(file, btn); }
    else { saveBlob(file.name, file); toast(`Скачано: ${file.name}`); }
  } catch (e) { toast((e && e.message) || "Не получилось сделать PDF"); }
  finally { btn.disabled = false; if (btn.textContent === "Готовлю…") btn.textContent = "Скачать PDF"; }
}
async function sharePdf(file, btn) {
  try { await navigator.share({ files: [file] }); btn.textContent = "Скачать PDF"; }
  catch (e) {
    if (e && e.name === "AbortError") return; // закрыли меню
    if (e && e.name === "NotAllowedError") { btn.textContent = "Сохранить PDF"; toast("PDF готов — нажми «Сохранить PDF»"); return; }
    saveBlob(file.name, file); toast(`Скачано: ${file.name}`);
  }
}
// для tools/pdf.py (#print/…~out=b64): PDF в base64 — в <pre id="pdf-b64">, headless Chrome отдаёт его через --dump-dom
async function pdfB64() {
  const pre = document.createElement("pre"); pre.id = "pdf-b64"; pre.hidden = true;
  try {
    if (document.fonts) await document.fonts.ready;
    const b = await pdfFile(); let s = "";
    for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000));
    pre.textContent = btoa(s);
  } catch (e) { pre.textContent = "ERR " + ((e && e.message) || e); }
  document.body.appendChild(pre);
}
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { hyphens(); fitPaper(); }, 150); });

// ---------- клавиши, перетаскивание файла в окно ----------
const go = (h) => { if (h) location.hash = h; };
document.addEventListener("keydown", (ev) => {
  if (location.hash.startsWith("#edit/") && (ev.metaKey || ev.ctrlKey) && /^[zyяН]$/i.test(ev.key)) {
    ev.preventDefault(); edGo(ev.key.toLowerCase() === "y" || ev.key.toLowerCase() === "н" || ev.shiftKey ? 1 : -1); return;
  }
  if (ev.key === "Escape" && ui.sheet) { ui.sheet = null; render(); return; }
  if (!$("#chartmain") || ev.target.closest("input, select, textarea")) return;
  if (curSet && !ui.sheet && (ev.key === "ArrowLeft" || ev.key === "ArrowRight") && !ev.metaKey && !ev.ctrlKey && !ev.altKey) { ev.preventDefault(); setGo(curSet.i + (ev.key === "ArrowRight" ? 1 : -1)); }
  else if (ev.key === "PageDown") { ev.preventDefault(); window.scrollBy({ top: innerHeight * 0.8 }); }
  else if (ev.key === "PageUp") { ev.preventDefault(); window.scrollBy({ top: -innerHeight * 0.8 }); }
});
const hasFiles = (ev) => ev.dataTransfer && [...ev.dataTransfer.types].includes("Files");
document.addEventListener("dragover", (ev) => { if (hasFiles(ev)) ev.preventDefault(); });
document.addEventListener("drop", async (ev) => {
  if (!hasFiles(ev)) return;
  ev.preventDefault();
  const f = ev.dataTransfer.files[0]; if (!f) return;
  const text = await f.text();
  if (location.hash.startsWith("#edit/") && ed.doc) { edLoad(text); toast("Открыт файл " + f.name); } else openLocal(text, f.name);
});

// ---------- тема, «Сцена» ----------
const rootEl = document.documentElement;
const hostTheme = rootEl.getAttribute("data-theme");
let lock = null;
async function applyTheme() {
  const t = S.stage ? "dark" : S.theme;
  if (t === "system") { if (hostTheme) rootEl.setAttribute("data-theme", hostTheme); else rootEl.removeAttribute("data-theme"); }
  else rootEl.setAttribute("data-theme", t);
  rootEl.style.setProperty("--fs", (1 + S.size * 0.1 + (S.stage ? 0.25 : 0)).toFixed(2));
  if (S.stage && !lock) { try { lock = await navigator.wakeLock?.request("screen"); } catch { lock = null; } }
  if (!S.stage && lock) { try { await lock.release(); } catch {} lock = null; }
}
document.addEventListener("visibilitychange", () => { if (S.stage && document.visibilityState === "visible") { lock = null; applyTheme(); } });

// ---------- маршруты ----------
// ---------- новая версия сайта ----------
// Сайт — одна страница: открытая вкладка живёт со старым кодом, пока её не перезагрузят, а браузер ещё и держит копию в кэше.
// Когда вкладка снова на экране (и раз в 10 минут), версия страницы сверяется с сайтом; если на сайте новее — плашка «Обновить».
let updAt = Date.now();
async function checkUpdate() {
  if (window.claude || location.protocol === "file:" || Date.now() - updAt < 5 * 60000 || $(".upd")) return;
  updAt = Date.now();
  try {
    const html = await (await fetch(location.pathname, { cache: "no-store" })).text();
    const v = (/const VERSION = "([\d.]+)"/.exec(html) || [])[1];
    if (!v || v === VERSION) return;
    const bar = document.createElement("div"); bar.className = "upd";
    bar.innerHTML = `<span>Вышла версия ${esc(v)}</span><button class="btn">Обновить</button>`;
    bar.querySelector("button").onclick = () => location.reload();
    document.body.appendChild(bar);
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
setInterval(checkUpdate, 10 * 60000);

let lastRoute = null, cameFrom = null; // cameFrom — откуда пришли: песня, открытая из библиотеки, возвращается в неё
function render() {
  const h = location.hash.slice(1);
  if (h !== lastRoute) { ui.sheet = null; cameFrom = lastRoute; }
  const keep = h === lastRoute ? window.scrollY : 0;
  lastRoute = h;
  const [path, qs = ""] = h.split("?");
  const q = {};
  for (const p of qs.split("&")) { const [k, v = ""] = p.split("="); if (k) try { q[k] = decodeURIComponent(v); } catch {} }
  let m, info;
  curSet = null;
  if ((m = /^setedit\/?([^/]*)$/.exec(path))) pageSetEdit(m[1], q);
  else if ((m = /^set\/([^/]*)(?:\/(\d+))?$/.exec(path))) { info = setInfo(m[1]); if (m[2]) pageSetSong(info, +m[2] - 1, q); else pageSet(info, q); }
  else if ((m = /^lib\/(?:[a-z0-9-]*\.)?([\w-]{20,})$/.exec(path))) pageLib(m[1]);
  else if ((m = /^edit\/(.+)$/.exec(path)) && (info = srcInfo(m[1]))) pageEdit(info);
  else if ((m = /^print\/([^~]+)(.*)$/.exec(path)) && (info = srcInfo(m[1]))) pagePrint(info, m[2].split("~").filter(Boolean));
  else if (path && (info = srcInfo(path))) pageSong(info, q);
  else pageHome();
  window.scrollTo({ top: keep, behavior: "instant" });
}
window.addEventListener("hashchange", render);
applyTheme();
render();
})();
</script>
